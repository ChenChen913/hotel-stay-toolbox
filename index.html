<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>酒店入住工具箱</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#22272e; --sub:#6b7280; --line:#e5e7eb; --brand:#2563eb; --brand-soft:#dbeafe; --ok:#16a34a; --danger:#dc2626; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:18px 16px 6px; max-width:640px; margin:0 auto; }
  header h1 { font-size:20px; margin:0; }
  header p { margin:2px 0 0; color:var(--sub); font-size:13px; }
  main { max-width:640px; margin:0 auto; padding:10px 14px 90px; }
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; max-width:640px; margin:0 auto; }
  nav button { flex:1; padding:13px 0 calc(13px + env(safe-area-inset-bottom)); background:none; border:0; font-size:14px; color:var(--sub); }
  nav button.on { color:var(--brand); font-weight:600; }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin:10px 0; box-shadow:0 1px 3px rgb(0 0 0 / .05); }
  .btn { display:block; width:100%; min-height:48px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-size:17px; font-weight:600; margin:10px 0; cursor:pointer; }
  .btn.ghost { background:var(--brand-soft); color:var(--brand); }
  .btn.small { display:inline-block; width:auto; min-height:38px; padding:6px 16px; font-size:14px; border-radius:10px; }
  .btn.plain { background:#eef0f3; color:var(--ink); }
  .row { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .grow { flex:1; min-width:0; }
  .row .name { font-size:16px; }
  .row.done .name { color:var(--sub); text-decoration:line-through; }
  .tag { font-size:11px; padding:2px 8px; border-radius:99px; background:#eef0f3; color:var(--sub); white-space:nowrap; }
  .tag.buy { background:#fef3c7; color:#92400e; }
  .tag.need { background:#fee2e2; color:#991b1b; }
  .tag.src { background:var(--brand-soft); color:var(--brand); }
  .stepper { display:flex; align-items:center; gap:2px; }
  .stepper button { width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:16px; }
  .stepper b { min-width:30px; text-align:center; }
  h2 { font-size:15px; margin:18px 0 6px; color:var(--sub); font-weight:600; }
  .prog { height:8px; background:#eef0f3; border-radius:99px; overflow:hidden; margin:8px 0; }
  .prog i { display:block; height:100%; background:var(--ok); transition:width .2s; }
  .progtext { font-size:13px; color:var(--sub); }
  .opts { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .opt { min-height:48px; padding:10px 18px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-size:16px; cursor:pointer; }
  .opt.on { border-color:var(--brand); background:var(--brand-soft); color:var(--brand); font-weight:600; }
  input[type=text], input[type=number], input[type=date], select { min-height:44px; padding:8px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:16px; background:#fff; }
  input[type=checkbox].tick { width:22px; height:22px; accent-color:var(--ok); }
  details { border-bottom:1px solid var(--line); padding:10px 0; }
  details:last-child { border-bottom:0; }
  summary { cursor:pointer; font-weight:600; font-size:15.5px; }
  details .body { margin:8px 0 4px; font-size:14.5px; color:#3d4450; }
  details .src { font-size:12px; color:var(--sub); }
  .hint { font-size:13px; color:var(--sub); }
  .tabs { display:flex; gap:6px; margin:10px 0; }
  .tabs button { flex:1; min-height:42px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-size:15px; }
  .tabs button.on { border-color:var(--brand); background:var(--brand-soft); color:var(--brand); font-weight:600; }
  .muted { color:var(--sub); font-size:13px; }
  .del { border:0; background:none; color:var(--danger); font-size:18px; padding:6px; cursor:pointer; }
</style>
</head>
<body>
<header><h1>🏨 酒店入住工具箱</h1><p>让每一次入住都少一点遗漏，多一点准备</p></header>
<main id="app"></main>
<nav>
  <button id="navHome" onclick="go('home')">🏠 首页</button>
  <button id="navKnow" onclick="go('know')">📚 知识库</button>
</nav>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
// —— 极简路由：home / wizard / stay / know ——
let view = 'home', currentStayId = null, tab = 'prep';
let wiz = null; // 向导临时状态

function go(v) { view = v; render(); }
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pct(done, all) { return all ? Math.round(done * 100 / all) : 0; }
function countDone(items) { return items.filter(i => i.done).length; }

// ---------- 首页 ----------
function renderHome() {
  const stays = listStays().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  let html = '';
  html += `<button class="btn" onclick="startWizard()">＋ 创建一次入住</button>`;
  if (stays.length) html += `<button class="btn ghost" onclick="copyLast()">⧉ 复制上一次入住</button>`;
  if (stays.length) {
    html += `<h2>最近的入住</h2>`;
    for (const s of stays) {
      const all = s.prep.length + s.custom.length, done = countDone(s.prep) + countDone(s.custom);
      html += `<div class="card row" style="cursor:pointer" onclick="openStay('${s.id}')">
        <div class="grow"><div class="name">${esc(s.date || '未填日期')} · ${s.nights} 晚</div>
        <div class="progtext">准备 ${done}/${all}　·　${s.conditions.purpose || '普通短住'}</div></div>›</div>`;
    }
  } else {
    html += `<div class="card hint">第一次使用：点上面按钮，回答 5 个小问题，系统帮你生成这次入住的准备清单（含数量）。数据只保存在本机浏览器。</div>`;
  }
  return html;
}

function copyLast() {
  const stays = listStays().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  if (!stays.length) return;
  const last = stays[0];
  const c = { ...last.conditions, date: '' };
  const stay = newStay(c, buildPrep(c));
  stay.custom = last.custom.map(i => ({ ...i, done: false }));
  saveStay(stay); openStay(stay.id);
}

// ---------- 向导 ----------
function startWizard() {
  wiz = { step: 1, date: '', nights: 1, adults: 1, children: 0, childAge: '0-3', elderly: false, pet: false,
          purpose: '普通短住', prefs: { sleep: false, hygiene: false, mosquito: false, gadgets: false } };
  view = 'wizard'; render();
}
function wizTogglePref(k) { wiz.prefs[k] = !wiz.prefs[k]; render(); }

function renderWizard() {
  const w = wiz;
  const head = `<div class="hint">第 ${w.step} 步，共 5 步</div>`;
  if (w.step === 1) return head + `<div class="card">
    <label>入住日期</label><br><input type="date" id="wDate" value="${w.date}" onchange="wiz.date=this.value"><br><br>
    <label>住几晚</label><br><input type="number" min="1" max="30" value="${w.nights}" onchange="wiz.nights=Math.max(1,Math.min(30,+this.value||1))">
    <p class="hint">晚数 ≥ 4 会自动加长住物品（洗衣、晾衣）。</p></div>
    <button class="btn" onclick="wiz.step=2;render()">下一步 →</button>`;
  if (w.step === 2) return head + `<div class="card"><label>这次有几个人入住？</label>
    <div class="opts">${[1,2,3].map(n=>`<button class="opt ${w.adults===n?'on':''}" onclick="wiz.adults=${n};render()">${n===3?'3 人及以上':n+' 人'}</button>`).join('')}</div></div>
    <button class="btn" onclick="wiz.step=3;render()">下一步 →</button>`;
  if (w.step === 3) return head + `<div class="card">
    <label>有儿童同行吗？</label>
    <div class="opts">${[0,1,2].map(n=>`<button class="opt ${w.children===n?'on':''}" onclick="wiz.children=${n};render()">${n===0?'没有':n+' 个'}</button>`).join('')}</div>
    ${w.children>0?`<br><label>儿童年龄段</label>
    <div class="opts">${[['0-3','0–3 岁'],['4-6','4–6 岁'],['7-12','7–12 岁'],['13+','13 岁以上']].map(([v,t])=>`<button class="opt ${w.childAge===v?'on':''}" onclick="wiz.childAge='${v}';render()">${t}</button>`).join('')}</div>`:''}
    <br><label>还有谁同行？</label>
    <div class="opts">
      <button class="opt ${w.elderly?'on':''}" onclick="wiz.elderly=!wiz.elderly;render()">👴 老人</button>
      <button class="opt ${w.pet?'on':''}" onclick="wiz.pet=!wiz.pet;render()">🐶 宠物</button>
    </div>
    ${w.pet?'<p class="hint">宠物用品差异大，稍后在清单里自行添加。</p>':''}</div>
    <button class="btn" onclick="wiz.step=4;render()">下一步 →</button>`;
  if (w.step === 4) return head + `<div class="card"><label>这次住宿属于哪种情况？</label>
    <div class="opts">${['普通短住','出差','旅游','探亲'].map(p=>`<button class="opt ${w.purpose===p?'on':''}" onclick="wiz.purpose='${p}';render()">${p}</button>`).join('')}</div></div>
    <button class="btn" onclick="wiz.step=5;render()">下一步 →</button>`;
  if (w.step === 5) return head + `<div class="card"><label>你在意哪些方面？（都会加进清单）</label>
    <div class="opts">
      <button class="opt ${w.prefs.sleep?'on':''}" onclick="wizTogglePref('sleep')">😴 睡眠敏感</button>
      <button class="opt ${w.prefs.hygiene?'on':''}" onclick="wizTogglePref('hygiene')">🧼 在意卫生</button>
      <button class="opt ${w.prefs.mosquito?'on':''}" onclick="wizTogglePref('mosquito')">🦟 蚊虫季节</button>
      <button class="opt ${w.prefs.gadgets?'on':''}" onclick="wizTogglePref('gadgets')">🔌 电子设备多</button>
    </div></div>
    <button class="btn" onclick="wiz.step=6;render()">生成清单 →</button>`;
  // 第 6 步：预览 + 调整
  if (wiz.preview == null) {
    wiz.preview = sortItems(buildPrep(w));
  }
  return `<div class="hint">确认清单：可改数量、可删，稍后也能加自定义物品。</div>${renderPrepList(wiz.preview, true)}
    <div class="card"><b>🧠 还有一些东西只有你自己知道</b>
    ${CUSTOM_HINTS.map(h=>`<div class="row"><span>${h.icon}</span><span class="grow hint">${h.text}</span></div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:10px">
      <input type="text" id="cName" placeholder="物品名，如：相机电池" style="flex:1">
      <input type="number" id="cQty" value="1" min="1" style="width:64px" title="数量">
      <button class="btn small" onclick="wizAddCustom()">＋</button>
    </div></div>
    <button class="btn" onclick="wizSave()">✅ 保存这次入住</button>
    <button class="btn plain" onclick="wiz.step=5;render()">← 上一步</button>`;
}
function wizAddCustom() {
  const name = document.getElementById('cName').value.trim();
  if (!name) return;
  wiz.preview.push({ name, cat: '自定义', unit: '件', prep: '自定义', source: '自定义', users: '共用', qty: +document.getElementById('cQty').value || 1, done: false });
  render();
}
function wizSave() {
  const stay = newStay({ ...wiz, date: wiz.date }, wiz.preview);
  saveStay(stay); wiz = null; openStay(stay.id);
}

// ---------- 行程详情 ----------
function openStay(id) { currentStayId = id; view = 'stay'; tab = 'prep'; render(); }
function stay() { return getStay(currentStayId); }

function renderPrepList(items, isWiz) {
  const s = isWiz ? null : stay();
  const cats = [...new Set(items.map(i => i.cat))].sort((a, b) => CAT_ORDER.indexOf(a) - CAT_ORDER.indexOf(b));
  return cats.map(cat => `<h2>${cat}</h2><div class="card">` + items.filter(i => i.cat === cat).map((i) => {
    const idx = items.indexOf(i);
    const prepTag = i.prep === '必带' ? '<span class="tag need">必带</span>' : i.prep === '建议购买' ? '<span class="tag buy">要买</span>' : i.prep === '自定义' ? '<span class="tag src">自定义</span>' : `<span class="tag">${i.prep}</span>`;
    const doneCb = isWiz ? '' : `<input type="checkbox" class="tick" ${i.done?'checked':''} onchange="togglePrep(${idx},this.checked)">`;
    const del = (isWiz || i.source === '自定义') ? `<button class="del" onclick="delPrep(${idx})">🗑</button>` : '';
    return `<div class="row ${i.done?'done':''}">${doneCb}
      <div class="grow"><div class="name">${esc(i.name)}</div>
      <div class="hint">${i.users} · ${prepTag}</div></div>
      <div class="stepper"><button onclick="stepQty(${idx},-1)">−</button><b>${i.qty}</b><button onclick="stepQty(${idx},1)">＋</button><span class="hint">${esc(i.unit)}</span></div>${del}</div>`;
  }).join('') + '</div>').join('');
}

function renderStay() {
  const s = stay(); if (!s) { view = 'home'; return renderHome(); }
  const items = sortItems([...s.prep, ...s.custom]);
  const all = items.length, done = countDone(items);
  const tabs = `<div class="tabs">
    <button class="${tab==='prep'?'on':''}" onclick="tab='prep';render()">🧳 准备</button>
    <button class="${tab==='checkin'?'on':''}" onclick="tab='checkin';render()">🛏️ 入住</button>
    <button class="${tab==='checkout'?'on':''}" onclick="tab='checkout';render()">🚪 退房</button></div>`;
  let body = '';
  if (tab === 'prep') {
    body = `<div class="progtext">${done}/${all} 已备齐</div><div class="prog"><i style="width:${pct(done,all)}%"></i></div>`
      + renderPrepList(items, false)
      + `<div class="card"><div style="display:flex;gap:8px">
          <input type="text" id="cName" placeholder="添加我的必带物品" style="flex:1">
          <input type="number" id="cQty" value="1" min="1" style="width:64px" title="数量">
          <button class="btn small" onclick="stayAddCustom()">＋</button></div>
          ${CUSTOM_HINTS.map(h=>`<div class="hint">${h.icon} ${h.text}</div>`).join('')}</div>`;
  } else {
    const key = tab; const cl = CHECKLISTS[key];
    const flat = cl.groups.reduce((n,g)=>n+g.items.length,0);
    const dn = s[key].reduce((n,g)=>n+g.filter(Boolean).length,0);
    body = `<div class="progtext">${dn}/${flat} 已完成</div><div class="prog"><i style="width:${pct(dn,flat)}%"></i></div>`
      + cl.groups.map((g,gi)=>`<h2>${g.risk} ${g.name}</h2><div class="card">` + g.items.map((t,ii)=>
        `<div class="row ${s[key][gi][ii]?'done':''}"><input type="checkbox" class="tick" ${s[key][gi][ii]?'checked':''} onchange="toggleCheck('${key}',${gi},${ii},this.checked)">
         <div class="grow name">${t}</div></div>`).join('') + '</div>').join('');
  }
  return `<div class="hint"><a href="#" onclick="go('home');return false">← 返回</a>　${esc(s.date||'未填日期')} · ${s.nights} 晚 · ${esc(s.conditions.purpose)}</div>` + tabs + body
    + `<button class="btn plain" onclick="delStayUI()">删除这次入住</button>`;
}
function togglePrep(idx, v) { const s = stay(); const items = sortItems([...s.prep, ...s.custom]); items[idx].done = v; persistSorted(items); }
function stepQty(idx, d) { const s = stay(); const items = sortItems([...s.prep, ...s.custom]); items[idx].qty = Math.max(1, items[idx].qty + d); persistSorted(items); }
function delPrep(idx) { const s = stay(); const items = sortItems([...s.prep, ...s.custom]); const it = items[idx]; s.prep = s.prep.filter(x=>x!==it); s.custom = s.custom.filter(x=>x!==it); saveStay(s); render(); }
function persistSorted(items) {
  const s = stay();
  s.prep = items.filter(i => i.source !== '自定义').map(i => { delete i.doneRef; return i; });
  s.custom = items.filter(i => i.source === '自定义');
  saveStay(s); render();
}
function stayAddCustom() {
  const s = stay();
  const name = document.getElementById('cName').value.trim();
  if (!name) return;
  s.custom.push({ name, cat: '自定义', unit: '件', prep: '自定义', source: '自定义', users: '共用', qty: +document.getElementById('cQty').value || 1, done: false });
  saveStay(s); render();
}
function toggleCheck(key, gi, ii, v) { const s = stay(); s[key][gi][ii] = v; saveStay(s); render(); }
function delStayUI() { if (confirm('删除这次入住的所有记录？')) { deleteStay(currentStayId); go('home'); } }

// ---------- 知识库 ----------
function renderKnow() {
  const mods = [...new Set(KNOWLEDGE.map(k => k.module))];
  return `<div class="hint">证据等级：🔵 官方法规 · 🟢 官方建议 · 🟡 专业机构 · ⚪ 个人经验　|　风险：🟢 注意 · 🟡 建议检查 · 🔴 立即处理</div>`
    + mods.map(m => `<h2>${m}</h2><div class="card">` + KNOWLEDGE.filter(k => k.module === m).map(k =>
      `<details><summary>${k.risk} ${esc(k.title)}</summary>
       <div class="body">${k.body}</div><div class="src">证据：${k.evidence}　来源：${esc(k.source)}　·　核查于 ${k.updated}</div></details>`).join('') + '</div>').join('');
}

// ---------- 渲染 ----------
function render() {
  const app = document.getElementById('app');
  app.innerHTML = view === 'home' ? renderHome()
    : view === 'wizard' ? renderWizard()
    : view === 'stay' ? renderStay()
    : renderKnow();
  document.getElementById('navHome').className = (view === 'home' || view === 'wizard' || view === 'stay') ? 'on' : '';
  document.getElementById('navKnow').className = view === 'know' ? 'on' : '';
  window.scrollTo(0, 0);
}
render();
</script>
</body>
</html>
